; May rua chen thuong mai - Arduino Mega 2560
;   pio run -e mega2560            build firmware
;   pio run -e mega2560 -t upload  nap board
;   pio device monitor             xem log 115200
;   pio test -e native             chay unit test tren PC (khong can board)

[env:mega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags = -std=gnu++17 -Wall -Wextra
build_unflags = -std=gnu++11
monitor_speed = 115200
lib_deps = duinowitchery/hd44780 @ ^1.3.2

; Unit test chay tren PC: chi bien dich Controller.cpp (khong phu thuoc Arduino).
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra -Isrc
build_src_filter = +<Controller.cpp>
test_build_src = yes
test_framework = unity
